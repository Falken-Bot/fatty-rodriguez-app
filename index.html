<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fatty Rodriguez | Executive Sports Terminal</title>
    <style>
        :root {
            --bg-color: #0a0a0c;
            --card-bg: #141418;
            --gold: #FFD700;
            --gold-dark: #FFA500;
            --text-main: #FFFFFF;
            --text-muted: #A0A0A5;
            --border-color: #2A2A30;
            --red-cut: #FF4D4D;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .fatty-header {
            background: #050507;
            border-bottom: 3px solid var(--gold);
            padding: 30px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.9);
        }
        
        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            text-align: center;
        }
        
        .fatty-badge-logo {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 3px solid var(--gold);
            object-fit: cover;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.5);
        }
        
        .brand-title-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .brand-name {
            font-weight: 900;
            font-size: 32px;
            letter-spacing: 3px;
            color: var(--text-main);
            margin: 0;
            text-transform: uppercase;
            background: linear-gradient(90deg, #FFFFFF 60%, var(--gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .brand-tagline {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 4px;
            color: var(--gold);
            margin-top: 4px;
            text-transform: uppercase;
        }

        .main-container {
            max-width: 800px;
            width: 100%;
            margin: 40px auto;
            padding: 0 20px;
            box-sizing: border-box;
            flex: 1;
        }

        .section-title {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--gold);
            text-transform: uppercase;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .parlay-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
        }

        .parlay-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-left: 5px solid var(--gold);
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .parlay-card h3 {
            margin: 0 0 15px 0;
            font-size: 18px;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
        }

        .leg-box {
            background: #1A1A20;
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        .leg-box.active-leg {
            border-left: 3px solid var(--gold);
        }

        .leg-box.cut-leg {
            border-left: 3px solid var(--red-cut);
            opacity: 0.75;
        }

        .leg-label {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .leg-label.active { color: var(--gold); }
        .leg-label.cut { color: var(--red-cut); }

        .leg-details {
            font-size: 14px;
            color: var(--text-main);
            margin: 0;
        }

        .distill-reason {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
            font-style: italic;
        }

        .action-panel {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 25px;
            border-radius: 8px;
            text-align: center;
        }

        .action-panel p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 20px;
        }

        .generate-btn {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: #000;
            border: none;
            padding: 14px 30px;
            font-weight: 900;
            font-size: 14px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(255, 215, 0, 0.3);
        }

        .generate-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .generate-btn:active {
            transform: translateY(1px);
        }

        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 12px;
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <header class="fatty-header">
      <div class="logo-container">
        <img src="assets/logo.jpg" alt="Fatty Rodriguez Logo" class="fatty-badge-logo">
        <div class="brand-title-group">
          <h1 class="brand-name">FATTY RODRIGUEZ</h1>
          <span class="brand-tagline">EXECUTIVE SPORTS TERMINAL</span>
        </div>
      </div>
    </header>

    <div class="main-container">
        <div class="section-title">
            <span>Today's Locked 2-Leg Parlay</span>
            <span id="current-date-display"></span>
        </div>

        <div id="parlay-container" class="parlay-grid">
            <div class="parlay-card">
                <p>Loading today's locked bets from database...</p>
            </div>
        </div>

        <div class="action-panel">
            <p>Manual control panel for triggering odds scan and parlay selection.</p>
            <button id="generate-btn" class="generate-btn" onclick="triggerManualScan()">Generate Parlay</button>
        </div>
    </div>

    <footer>
        FATTY RODRIGUEZ ANALYTICAL PARLAYS &copy; 2026
    </footer>

    <script>
        let RAW_URL = "https://ejnwsxbpuumcpyxnmsaz.supabase.co";
        const SUPABASE_URL = RAW_URL.replace(/\/+$/, '').replace(/\/rest\/v1\/?$/, '');
        
        // REPLACE WITH YOUR ACTUAL SUPABASE ANON KEY
        const SUPABASE_KEY = "sb_publishable_M4seLrgZoXLBY9m01uMa1Q_ZFHBW1Dp";

        function getTodayStrET() {
            const now = new Date();
            const formatter = new Intl.DateTimeFormat('en-US', {
                timeZone: 'America/New_York',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            });
            const parts = formatter.formatToParts(now);
            const m = parts.find(p => p.type === 'month').value;
            const d = parts.find(p => p.type === 'day').value;
            const y = parts.find(p => p.type === 'year').value;
            return `${y}-${m}-${d}`;
        }

        function parsePickString(pickStr) {
            const parts = pickStr.split('||');
            return {
                leg1: parts[0] ? parts[0].replace('LEG 1:', '').trim() : 'Active Leg 1',
                leg2: parts[1] ? parts[1].replace('LEG 2:', '').trim() : 'Active Leg 2',
                dropped: parts[2] ? parts[2].replace('DROPPED:', '').trim() : 'Leg 3 (Distilled Out)'
            };
        }

        async function loadTodayBets() {
            const todayStr = getTodayStrET();
            document.getElementById('current-date-display').innerText = todayStr;

            let url = `${SUPABASE_URL}/rest/v1/bets?event_date=like.${todayStr}*&select=*`;
            
            try {
                let response = await fetch(url, {
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": `Bearer ${SUPABASE_KEY}`
                    }
                });
                let bets = await response.json();

                if (!Array.isArray(bets) || bets.length === 0) {
                    const fallbackUrl = `${SUPABASE_URL}/rest/v1/bets?select=*&order=id.desc&limit=1`;
                    response = await fetch(fallbackUrl, {
                        headers: {
                            "apikey": SUPABASE_KEY,
                            "Authorization": `Bearer ${SUPABASE_KEY}`
                        }
                    });
                    bets = await response.json();
                }
                
                const container = document.getElementById('parlay-container');
                if (Array.isArray(bets) && bets.length > 0) {
                    const record = bets[0];
                    const parsed = parsePickString(record.pick || '');

                    container.innerHTML = `
                        <div class="parlay-card">
                            <h3>
                                <span>FATTY'S 2-LEG PARLAY</span>
                                <span>$${Number(record.wager_amount || 2).toFixed(2)} BASE WAGER</span>
                            </h3>
                            
                            <div class="leg-box active-leg">
                                <div class="leg-label active">PARLAY LEG 1 (ACTIVE)</div>
                                <div class="leg-details">${parsed.leg1}</div>
                            </div>

                            <div class="leg-box active-leg">
                                <div class="leg-label active">PARLAY LEG 2 (ACTIVE)</div>
                                <div class="leg-details">${parsed.leg2}</div>
                            </div>

                            <div class="leg-box cut-leg">
                                <div class="leg-label cut">DISTILLED OUT (CANDIDATE LEG 3)</div>
                                <div class="leg-details">${parsed.dropped}</div>
                            </div>

                            <div class="distill-reason">
                                <strong>Distillation Rationale:</strong> Candidate 3 was dropped to isolate the optimal 2-leg cross-sport value baseline.
                            </div>
                        </div>
                    `;
                } else {
                    container.innerHTML = `
                        <div class="parlay-card">
                            <p>No bets stored in database. Click generate below to run a scan.</p>
                        </div>
                    `;
                }
            } catch (err) {
                console.error("Error loading bets:", err);
                document.getElementById('parlay-container').innerHTML = `
                    <div class="parlay-card">
                        <p>Error connecting to database. Verify credentials in index.html.</p>
                    </div>
                `;
            }
        }

        async function triggerManualScan() {
            const btn = document.getElementById('generate-btn');
            btn.innerText = "Scanning Markets...";
            btn.disabled = true;

            try {
                const res = await fetch('/api/trigger', { method: 'POST' });
                if (res.ok) {
                    alert("Scan triggered successfully! Refreshing page in 10 seconds...");
                    setTimeout(() => location.reload(), 10000);
                } else {
                    alert("Trigger failed. Check serverless function logs.");
                    btn.innerText = "Generate Parlay";
                    btn.disabled = false;
                }
            } catch (e) {
                console.error(e);
                alert("Network error calling trigger endpoint.");
                btn.innerText = "Generate Parlay";
                btn.disabled = false;
            }
        }

        window.onload = loadTodayBets;
    </script>
</body>
</html>
