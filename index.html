<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fatty Rodriguez | Executive Sports Terminal</title>
    <style>
        :root {
            --bg-color: #0a0a0c;
            --card-bg: #141418;
            --gold: #FFD700;
            --gold-dark: #FFA500;
            --text-main: #FFFFFF;
            --text-muted: #A0A0A5;
            --border-color: #2A2A30;
            --red-cut: #FF4D4D;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .fatty-header {
            background: #050507;
            border-bottom: 4px solid var(--gold);
            padding: 40px 20px 30px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 15px 50px rgba(0,0,0,0.95);
        }
        
        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            text-align: center;
        }
        
        .fatty-badge-logo {
            width: 240px;
            height: 240px;
            border-radius: 50%;
            border: 4px solid var(--gold);
            object-fit: cover;
            box-shadow: 0 0 35px rgba(255, 215, 0, 0.6);
        }
        
        .brand-title-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .brand-name {
            font-weight: 900;
            font-size: 38px;
            letter-spacing: 4px;
            color: var(--text-main);
            margin: 0;
            text-transform: uppercase;
            background: linear-gradient(90deg, #FFFFFF 50%, var(--gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .brand-tagline {
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 5px;
            color: var(--gold);
            margin-top: 6px;
            text-transform: uppercase;
        }

        .main-container {
            max-width: 850px;
            width: 100%;
            margin: 40px auto;
            padding: 0 20px;
            box-sizing: border-box;
            flex: 1;
        }

        .section-title {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--gold);
            text-transform: uppercase;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .parlay-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
        }

        .parlay-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-left: 5px solid var(--gold);
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .parlay-card h3 {
            margin: 0 0 18px 0;
            font-size: 18px;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
        }

        .leg-box {
            background: #1A1A20;
            border: 1px solid var(--border-color);
            padding: 14px 18px;
            border-radius: 6px;
            margin-bottom: 12px;
        }

        .leg-box.active-leg {
            border-left: 4px solid var(--gold);
        }

        .leg-box.cut-leg {
            border-left: 4px solid var(--red-cut);
            opacity: 0.8;
        }

        .leg-label {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .leg-label.active { color: var(--gold); }
        .leg-label.cut { color: var(--red-cut); }

        .leg-details {
            font-size: 15px;
            color: var(--text-main);
            margin: 0;
            line-height: 1.4;
        }

        .distill-reason {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 15px;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
            font-style: italic;
            line-height: 1.4;
        }

        /* History Ledger Styles */
        .history-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-left: 5px solid var(--text-muted);
            padding: 18px 20px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 700;
            color: var(--gold);
            margin-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .history-legs {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .action-panel {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 25px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 40px;
        }

        .action-panel p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 20px;
        }

        .generate-btn {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: #000;
            border: none;
            padding: 14px 30px;
            font-weight: 900;
            font-size: 14px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(255, 215, 0, 0.3);
        }

        .generate-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .generate-btn:active {
            transform: translateY(1px);
        }

        .generate-btn:disabled {
            background: #4A4A50;
            color: #8A8A90;
            cursor: not-allowed;
            box-shadow: none;
        }

        .scan-status-msg {
            margin-top: 15px;
            font-size: 13px;
            font-weight: 700;
            color: var(--gold);
            letter-spacing: 1px;
            min-height: 18px;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 12px;
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <header class="fatty-header">
      <div class="logo-container">
        <img src="assets/logo.jpg" alt="Fatty Rodriguez Logo" class="fatty-badge-logo">
        <div class="brand-title-group">
          <h1 class="brand-name">FATTY RODRIGUEZ</h1>
          <span class="brand-tagline">EXECUTIVE SPORTS TERMINAL</span>
        </div>
      </div>
    </header>

    <div class="main-container">
        <!-- Active Parlay Section -->
        <div class="section-title">
            <span>Today's Locked 2-Leg Parlay</span>
            <span id="current-date-display"></span>
        </div>

        <div id="parlay-container" class="parlay-grid">
            <div class="parlay-card">
                <p>Loading today's locked bets from database...</p>
            </div>
        </div>

        <!-- Manual Control Panel -->
        <div class="action-panel">
            <p>Manual control panel for triggering odds scan and parlay selection.</p>
            <button id="generate-btn" class="generate-btn" onclick="triggerManualScan()">Generate Parlay</button>
            <div id="scan-status" class="scan-status-msg"></div>
        </div>

        <!-- Historical Ledger Section -->
        <div class="section-title">
            <span>Historical Ledger & Performance Archive</span>
        </div>
        <div id="history-container">
            <div class="parlay-card">
                <p>Loading historical ledger...</p>
            </div>
        </div>
    </div>

    <footer>
        FATTY RODRIGUEZ ANALYTICAL PARLAYS &copy; 2026
    </footer>

    <script>
        let RAW_URL = "https://ejnwsxbpuumcpyxnmsaz.supabase.co";
        const SUPABASE_URL = RAW_URL.replace(/\/+$/, '').replace(/\/rest\/v1\/?$/, '');
        const SUPABASE_KEY = "sb_publishable_M4seLrgZoXLBY9m01uMa1Q_ZFHBW1Dp";

        let currentLatestId = null;

        function getTodayStrET() {
            const now = new Date();
            const formatter = new Intl.DateTimeFormat('en-US', {
                timeZone: 'America/New_York',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            });
            const parts = formatter.formatToParts(now);
            const m = parts.find(p => p.type === 'month').value;
            const d = parts.find(p => p.type === 'day').value;
            const y = parts.find(p => p.type === 'year').value;
            return `${y}-${m}-${d}`;
        }

        function parsePickString(rawPick) {
            if (rawPick.includes('||')) {
                const parts = rawPick.split('||');
                return {
                    l1: parts[0] ? parts[0].replace(/LEG1?:/, '').trim() : 'Active Leg 1',
                    l2: parts[1] ? parts[1].replace(/LEG2?:/, '').trim() : 'Active Leg 2',
                    l3: parts[2] ? parts[2].replace(/DROPPED:/, '').trim() : 'Leg 3 (Distilled Out)'
                };
            }
            return {
                l1: rawPick,
                l2: 'Single-sport legacy format.',
                l3: 'N/A'
            };
        }

        async function fetchAllBets() {
            let url = `${SUPABASE_URL}/rest/v1/bets?select=*&order=id.desc&limit=15`;
            let response = await fetch(url, {
                cache: 'no-store',
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": `Bearer ${SUPABASE_KEY}`
                }
            });
            if (!response.ok) {
                throw new Error(`Supabase Error ${response.status}: ${await response.text()}`);
            }
            let bets = await response.json();
            return Array.isArray(bets) ? bets : [];
        }

        async function loadTerminalData() {
            const todayStr = getTodayStrET();
            document.getElementById('current-date-display').innerText = todayStr;
            const parlayContainer = document.getElementById('parlay-container');
            const historyContainer = document.getElementById('history-container');

            try {
                const bets = await fetchAllBets();
                if (bets.length > 0) {
                    currentLatestId = bets[0].id;
                    
                    // 1. Render Active Top Parlay (Newest)
                    const latestParsed = parsePickString(bets[0].pick);
                    parlayContainer.innerHTML = `
                        <div class="parlay-card">
                            <h3>
                                <span>FATTY'S 2-LEG PARLAY</span>
                                <span>$${Number(bets[0].wager_amount || 2).toFixed(2)} BASE WAGER</span>
                            </h3>
                            
                            <div class="leg-box active-leg">
                                <div class="leg-label active">PARLAY LEG 1 (ACTIVE)</div>
                                <div class="leg-details">${latestParsed.l1}</div>
                            </div>

                            <div class="leg-box active-leg">
                                <div class="leg-label active">PARLAY LEG 2 (ACTIVE)</div>
                                <div class="leg-details">${latestParsed.l2}</div>
                            </div>

                            <div class="leg-box cut-leg">
                                <div class="leg-label cut">DISTILLED OUT (CANDIDATE LEG 3)</div>
                                <div class="leg-details">${latestParsed.l3}</div>
                            </div>

                            <div class="distill-reason">
                                <strong>Date:</strong> ${bets[0].event_date} | <strong>Status:</strong> ${bets[0].status.toUpperCase()}
                            </div>
                        </div>
                    `;

                    // 2. Render Historical Ledger (Older records)
                    if (bets.length > 1) {
                        let historyHTML = '';
                        for (let i = 1; i < bets.length; i++) {
                            const b = bets[i];
                            historyHTML += `
                                <div class="history-card">
                                    <div class="history-header">
                                        <span>DATE: ${b.event_date} (ID: ${b.id})</span>
                                        <span>STATUS: ${b.status.toUpperCase()} | WAGER: $${Number(b.wager_amount || 2).toFixed(2)}</span>
                                    </div>
                                    <div class="history-legs">${b.pick}</div>
                                </div>
                            `;
                        }
                        historyContainer.innerHTML = historyHTML;
                    } else {
                        historyContainer.innerHTML = `
                            <div class="history-card">
                                <p style="color: var(--text-muted); font-size: 13px; margin: 0;">No prior historical records found in ledger yet.</p>
                            </div>
                        `;
                    }

                } else {
                    parlayContainer.innerHTML = `<div class="parlay-card"><p>No bets returned from database query.</p></div>`;
                    historyContainer.innerHTML = `<div class="history-card"><p>No history available.</p></div>`;
                }
            } catch (err) {
                console.error("Error loading terminal data:", err);
                parlayContainer.innerHTML = `
                    <div class="parlay-card" style="border-left-color: #FF4D4D;">
                        <h3 style="color: #FF4D4D;">DATABASE ERROR</h3>
                        <p>${err.message}</p>
                    </div>
                `;
            }
        }

        async function triggerManualScan() {
            const btn = document.getElementById('generate-btn');
            const statusDiv = document.getElementById('scan-status');

            btn.innerText = "Scanning Markets...";
            btn.disabled = true;
            statusDiv.innerText = "Dispatching cloud workflow...";

            try {
                const res = await fetch('/api/trigger', { method: 'POST' });
                const data = await res.json();

                if (!res.ok) {
                    statusDiv.innerText = `Error: ${data.error || 'Trigger failed'}`;
                    btn.innerText = "Generate Parlay";
                    btn.disabled = false;
                    return;
                }

                statusDiv.innerText = "Cloud runner active. Polling Supabase for new parlay...";
                let elapsedSeconds = 0;
                const initialId = currentLatestId;

                const pollInterval = setInterval(async () => {
                    elapsedSeconds += 3;
                    
                    try {
                        const newBets = await fetchAllBets();
                        if (newBets.length > 0 && newBets[0].id !== initialId) {
                            clearInterval(pollInterval);
                            statusDiv.innerText = "New cross-sport parlay locked! Updating terminal...";
                            setTimeout(() => location.reload(true), 600);
                            return;
                        }
                    } catch (e) {
                        console.error("Polling error:", e);
                    }

                    if (elapsedSeconds < 120) {
                        statusDiv.innerText = `Scanning sportsbooks... (${elapsedSeconds}s elapsed)`;
                    } else {
                        clearInterval(pollInterval);
                        statusDiv.innerText = "Scan processing complete.";
                        btn.innerText = "Generate Parlay";
                        btn.disabled = false;
                    }
                }, 3000);

            } catch (e) {
                console.error(e);
                statusDiv.innerText = "Network error calling trigger endpoint.";
                btn.innerText = "Generate Parlay";
                btn.disabled = false;
            }
        }

        window.onload = loadTerminalData;
    </script>
</body>
</html>
