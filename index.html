<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fatty Rodriguez | Executive Sports Terminal</title>
    <style>
        :root {
            --bg-color: #0a0a0c;
            --card-bg: #141418;
            --gold: #FFD700;
            --gold-dark: #FFA500;
            --text-main: #FFFFFF;
            --text-muted: #A0A0A5;
            --border-color: #2A2A30;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .fatty-header {
            background: var(--bg-color);
            border-bottom: 2px solid var(--gold);
            padding: 20px 30px;
            display: flex;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        
        .logo-container {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .fatty-badge-logo {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            border: 2px solid var(--gold);
            object-fit: cover;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }
        
        .brand-title-group {
            display: flex;
            flex-direction: column;
        }
        
        .brand-name {
            font-weight: 900;
            font-size: 26px;
            letter-spacing: 2px;
            color: var(--text-main);
            margin: 0;
            text-transform: uppercase;
        }
        
        .brand-tagline {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--gold);
            margin-top: 2px;
            text-transform: uppercase;
        }

        .main-container {
            max-width: 800px;
            width: 100%;
            margin: 40px auto;
            padding: 0 20px;
            box-sizing: border-box;
            flex: 1;
        }

        .section-title {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--gold);
            text-transform: uppercase;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .parlay-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .bet-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--gold);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .bet-card h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .bet-card p {
            margin: 6px 0;
            color: var(--text-muted);
            font-size: 14px;
        }

        .bet-card p strong {
            color: var(--text-main);
        }

        .action-panel {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 25px;
            border-radius: 8px;
            text-align: center;
        }

        .action-panel p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 20px;
        }

        .generate-btn {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: #000;
            border: none;
            padding: 14px 30px;
            font-weight: 900;
            font-size: 14px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(255, 215, 0, 0.3);
        }

        .generate-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .generate-btn:active {
            transform: translateY(1px);
        }

        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 12px;
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <header class="fatty-header">
      <div class="logo-container">
        <img src="assets/logo.jpg" alt="Fatty Rodriguez Logo" class="fatty-badge-logo">
        <div class="brand-title-group">
          <h1 class="brand-name">FATTY RODRIGUEZ</h1>
          <span class="brand-tagline">EXECUTIVE SPORTS TERMINAL</span>
        </div>
      </div>
    </header>

    <div class="main-container">
        <div class="section-title">
            <span>Today's Locked Parlay</span>
            <span id="current-date-display"></span>
        </div>

        <div id="parlay-container" class="parlay-grid">
            <div class="bet-card">
                <p>Loading today's locked bets from database...</p>
            </div>
        </div>

        <div class="action-panel">
            <p>Manual control panel for triggering odds scan and parlay selection.</p>
            <button id="generate-btn" class="generate-btn" onclick="triggerManualScan()">Generate Parlay</button>
        </div>
    </div>

    <footer>
        FATTY RODRIGUEZ ANALYTICAL PARLAYS &copy; 2026
    </footer>

    <script>
        // REPLACE THESE WITH YOUR ACTUAL SUPABASE CREDENTIALS
        const SUPABASE_URL = "https://ejnwsxbpuumcpyxnmsaz.supabase.co/rest/v1";
        const SUPABASE_KEY = "sb_publishable_M4seLrgZoXLBY9m01uMa1Q_ZFHBW1Dp";

        function getTodayStrET() {
            const now = new Date();
            const formatter = new Intl.DateTimeFormat('en-US', {
                timeZone: 'America/New_York',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            });
            const parts = formatter.formatToParts(now);
            const m = parts.find(p => p.type === 'month').value;
            const d = parts.find(p => p.type === 'day').value;
            const y = parts.find(p => p.type === 'year').value;
            return `${y}-${m}-${d}`;
        }

        async function loadTodayBets() {
            const todayStr = getTodayStrET();
            document.getElementById('current-date-display').innerText = todayStr;

            // Primary query: check exact date match
            let url = `${SUPABASE_URL}/rest/v1/bets?event_date=like.${todayStr}*&select=*`;
            
            try {
                let response = await fetch(url, {
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": `Bearer ${SUPABASE_KEY}`
                    }
                });
                let bets = await response.json();

                // Fallback query: if no exact date match, pull the latest 2 inserted rows
                if (!Array.isArray(bets) || bets.length === 0) {
                    const fallbackUrl = `${SUPABASE_URL}/rest/v1/bets?select=*&order=id.desc&limit=2`;
                    response = await fetch(fallbackUrl, {
                        headers: {
                            "apikey": SUPABASE_KEY,
                            "Authorization": `Bearer ${SUPABASE_KEY}`
                        }
                    });
                    bets = await response.json();
                }
                
                const container = document.getElementById('parlay-container');
                if (Array.isArray(bets) && bets.length > 0) {
                    container.innerHTML = bets.map(b => `
                        <div class="bet-card">
                            <h3>${b.sport || 'Sports Pick'}</h3>
                            <p><strong>Matchup:</strong> ${b.matchup}</p>
                            <p><strong>Pick:</strong> ${b.pick} (${b.odds > 0 ? '+' + b.odds : b.odds})</p>
                            <p><strong>Wager:</strong> $${Number(b.wager_amount || 2).toFixed(2)}</p>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = `
                        <div class="bet-card">
                            <p>No bets stored in database. Click generate below to run a scan.</p>
                        </div>
                    `;
                }
            } catch (err) {
                console.error("Error loading bets:", err);
                document.getElementById('parlay-container').innerHTML = `
                    <div class="bet-card">
                        <p>Error connecting to database. Verify credentials in index.html.</p>
                    </div>
                `;
            }
        }

        async function triggerManualScan() {
            const btn = document.getElementById('generate-btn');
            btn.innerText = "Scanning Markets...";
            btn.disabled = true;

            try {
                const res = await fetch('/api/trigger', { method: 'POST' });
                if (res.ok) {
                    alert("Scan triggered successfully! Refreshing page in 10 seconds...");
                    setTimeout(() => location.reload(), 10000);
                } else {
                    alert("Trigger failed. Check serverless function logs.");
                    btn.innerText = "Generate Parlay";
                    btn.disabled = false;
                }
            } catch (e) {
                console.error(e);
                alert("Network error calling trigger endpoint.");
                btn.innerText = "Generate Parlay";
                btn.disabled = false;
            }
        }

        window.onload = loadTodayBets;
    </script>
</body>
</html>
