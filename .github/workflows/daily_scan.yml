name: Fatty Rodriguez Daily Scan

on:
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * *'

jobs:
  run-fatty-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install requests
        
      - name: Run daily scan script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          PYTHONUNBUFFERED: "1"   # <-- Forces Python to print logs instantly without buffering
        run: python process_daily_picks.py
