name: Executive Sports Terminal Automation

on:
  schedule:
    # 11:30 AM ET (15:30 UTC) - Market Scanning & Daily Pick Generation
    - cron: '30 15 * * *'
    # 2:00 AM ET (06:00 UTC) - Nightly Bet Grading & Record Settlement
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  run-terminal-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v3

      - name: Set Up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Market Scan (11:30 AM ET Schedule)
        if: github.event.schedule == '30 15 * * *' || github.event_name == 'workflow_dispatch'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python process_daily_picks.py

      - name: Run Bet Settlement & Grading (2:00 AM ET Schedule)
        if: github.event.schedule == '0 6 * * *' || github.event_name == 'workflow_dispatch'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python grade_picks.py
